name: E2E Tests

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - '.claude/**'
      - 'docs/**'
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  client-unit-tests:
    name: Client Unit Tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --include=dev
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build

  unit-tests:
    name: Unit & Script Tests
    runs-on: ubuntu-latest
    outputs:
      integration: ${{ steps.suites.outputs.integration }}
      frontend_live: ${{ steps.suites.outputs.frontend_live }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci --include=dev
      - run: npm run contracts:check
      - run: npm run build:server
      - run: npm run test:packages:unit
      - name: Discover every integration and frontend live file
        id: suites
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const files = fs.readdirSync('packages/e2e/src', { recursive: true })
            .filter(file => file.endsWith('.test.ts') && !file.endsWith('.unit.test.ts'))
            .sort();
          if (!files.length) throw new Error('No integration tests found');
          const include = files.map(file => ({
            file: 'src/' + file.replaceAll('\\', '/'),
            name: file.replace(/\.test\.ts$/, ''),
          }));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'integration=' + JSON.stringify({ include }) + '\n');
          const liveFiles = fs.readdirSync('src', { recursive: true })
            .filter(file => file.endsWith('.live.spec.ts'))
            .sort();
          if (!liveFiles.length) throw new Error('No frontend live tests found');
          const live = liveFiles.map(file => ({
            file: 'src/' + file.replaceAll('\\', '/'),
            name: file.replace(/\.live\.spec\.ts$/, ''),
          }));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'frontend_live=' + JSON.stringify({ include: live }) + '\n');
          NODE

  frontend-live-tests:
    name: Frontend Live Tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: [client-unit-tests, unit-tests]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.unit-tests.outputs.frontend_live) }}
    env:
      ARK_SERVER_URL: http://localhost:7070
      ESPLORA_URL: http://localhost:3000/api
      EMULATOR_URL: http://localhost:7073
      REGTEST_ENV: ${{ github.workspace }}/.env.regtest
      REGTEST_PROJECT: arkade-regtest
      REGTEST_CONTAINER_PREFIX: ''
      TEST_FILE: ${{ matrix.file }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --include=dev
      - run: npm run build:server
      - name: Start a fresh frontend test stack
        run: npm run regtest -- start --profile ark --profile emulator
      - name: Run the complete frontend live file
        run: npm run test:live -- --run "$TEST_FILE" --dangerouslyIgnoreUnhandledErrors=false
      - name: Capture service logs
        if: failure()
        run: |
          docker ps -a
          docker logs arkd --tail 200 || true
          docker logs emulator --tail 200 || true
      - name: Remove this test stack
        if: always()
        run: npm run regtest -- clean

  e2e-tests:
    name: E2E Integration Tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: [client-unit-tests, unit-tests]
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.unit-tests.outputs.integration) }}
    env:
      ARK_SERVER_URL: http://localhost:7070
      ESPLORA_URL: http://localhost:3000/api
      EMULATOR_URL: http://localhost:7073
      EMULATOR_PUBLIC_URL: http://localhost:7073
      EXIT_PROBE: '1'
      LOAD_WALLETS: '5'
      LOAD_GAMES: '20'
      LOAD_CONC: '6'
      TEST_FILE: ${{ matrix.file }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --include=dev
      - run: npm run build:server
      - name: Start a fresh stack for this file
        shell: bash
        run: |
          if [[ "$TEST_FILE" == 'src/v4-cooperative-exit-probe.test.ts' ]]; then
            export ARKD_VTXO_TREE_EXPIRY=180
            export ARKD_UNILATERAL_EXIT_DELAY=5
            export ARKD_PUBLIC_UNILATERAL_EXIT_DELAY=5
            export ARKD_BOARDING_EXIT_DELAY=180
            export ARKD_CHECKPOINT_EXIT_DELAY=5
          fi
          # The rescue window opens minTTL (6000s) before batch expiry; a shorter tree reaches it in about 11 minutes.
          if [[ "$TEST_FILE" == 'src/pool-rescue.test.ts' ]]; then
            export ARKD_VTXO_TREE_EXPIRY=6656
          fi
          if [[ "$TEST_FILE" == 'src/lightning.test.ts' ]]; then
            npm run regtest -- start --profile intent-solver
            node scripts/regtest-relay.mjs
          else
            npm run regtest -- start --profile ark --profile emulator
          fi
      - name: Run the complete file
        working-directory: packages/e2e
        run: npx jest --runInBand --forceExit --testTimeout=600000 --ci --runTestsByPath "$TEST_FILE"
      - name: Capture service logs
        if: failure()
        run: |
          docker ps -a
          docker logs arkd --tail 200 || true
          docker logs emulator --tail 200 || true
          docker logs intent-solver --tail 100 || true
      - name: Remove this test stack
        if: always()
        run: npm run regtest -- clean
