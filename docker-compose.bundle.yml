# One image serves the game/API on 3000 and the admin UI on loopback 3002.
services:
  coinflip:
    image: ghcr.io/arklabshq/coinflip-bundle:${COINFLIP_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.bundle
    ports:
      - "3000:3000"
      - "127.0.0.1:3002:3002"
    environment:
      ARK_SERVER_URL: ${ARK_SERVER_URL:-https://mutinynet.arkade.sh}
      EMULATOR_URL: ${EMULATOR_URL:-https://emulator.mutinynet.arkade.sh}
      EMULATOR_PUBLIC_URL: ${EMULATOR_PUBLIC_URL:-https://emulator.mutinynet.arkade.sh}
      ESPLORA_URL: ${ESPLORA_URL:-https://mempool.mutinynet.arkade.sh/api}
    volumes:
      - coinflip-data:/app/data
    restart: unless-stopped

volumes:
  coinflip-data:
