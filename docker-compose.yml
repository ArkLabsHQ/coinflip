services:
  server:
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    volumes:
      - server-data:/app/data
    environment:
      ARK_SERVER_URL: http://arkd:7070
      ARK_SERVER_PUBLIC_URL: http://localhost:7070
      ESPLORA_URL: http://mempool_web/api
      ESPLORA_PUBLIC_URL: http://localhost:3000/api
      EMULATOR_URL: http://emulator:7073
      EMULATOR_PUBLIC_URL: http://localhost:7073
      PUBLIC_PORT: 3001
      ADMIN_PORT: 3002
      ADMIN_HOST: 0.0.0.0
      DATA_DIR: /app/data
    ports:
      - "127.0.0.1:3002:3002"
    networks: [regtest]
    restart: unless-stopped

  client:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    environment:
      API_HOST: server
      API_PORT: 3001
    depends_on: [server]
    networks: [regtest]
    restart: unless-stopped

networks:
  regtest:
    external: true
    name: ${REGTEST_NETWORK:-arkade-regtest_default}

volumes:
  server-data:
